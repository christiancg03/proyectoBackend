  # --- ADMINISTRACIÓN: CONTACTO / SOPORTE ---
  /admin_contactos_listar.php:
    get:
      tags:
        - Administración - Contacto
      summary: Listar todos los mensajes de contacto (Admin)
      description: Devuelve el buzón de soporte completo para que el administrador pueda ver los mensajes de los usuarios.
