components:
  schemas:
    SimpleResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          description: Mensaje explicativo del resultado de la acción.

    Usuario:
      type: object
      properties:
        id:
          type: integer
        usuario:
          type: string
        email:
          type: string
        nombre_completo:
          type: string
        fecha_nacimiento:
          type: string
          format: date
        genero:
          type: string
        pais:
          type: string
        biografia:
          type: string
        foto:
          type: string
          description: Ruta relativa a la imagen de perfil.
        rol:
          type: string
          description: 'Rol del usuario (por ejemplo: admin, user)'
        creado_en:
          type: string

    Noticia:
      type: object
      properties:
        id:
          type: integer
        titulo:
          type: string
        contenido:
          type: string
        imagen:
          type: string
          description: Ruta de la foto de la noticia.
        fecha:
          type: string
          description: Fecha de publicación.
        autor_id:
          type: integer
        autor_nombre:
          type: string

    Comentario:
      type: object
      properties:
        id:
          type: integer
        noticia_id:
          type: integer
        usuario_id:
          type: integer
        usuario_nombre:
          type: string
        usuario_foto:
          type: string
        contenido:
          type: string
        fecha:
          type: string
        respuesta_a_id:
          type: integer
          nullable: true

    Amigo:
      type: object
      properties:
        id:
          type: integer
          description: ID de la relación de amistad.
        usuario_id:
          type: integer
        amigo_id:
          type: integer
        aceptado:
          type: integer
          description: '0 = Pendiente, 1 = Aceptado'
        creado_en:
          type: string
        user_relacionado_id:
          type: integer
          description: El ID del amigo con el que se tiene la relación.
        usuario:
          type: string
          description: Nombre de usuario de la relación.
        foto:
          type: string
          description: Foto del amigo.

    Mensaje:
      type: object
      properties:
        id:
          type: integer
        emisor_id:
          type: integer
        receptor_id:
          type: integer
        contenido:
          type: string
        fecha:
          type: string

    Resena:
      type: object
      properties:
        id:
          type: integer
        videojuego:
          type: string
        opinion:
          type: string
        puntuacion:
          type: integer
        fecha_lanzamiento:
          type: string
        desarrollo:
          type: string
        produccion:
          type: string
        distribucion:
          type: string
        precio:
          type: string
        jugadores:
          type: string
        formato:
          type: string
        textos:
          type: string
        voces:
          type: string
        online:
          type: string
        imagen:
          type: string
        creado_en:
          type: string

    BibliotecaItem:
      type: object
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        titulo:
          type: string
        saga:
          type: string
          nullable: true
        estado:
          type: string
        opinion:
          type: string
          nullable: true
        valoracion:
          type: integer
          nullable: true
        imagen:
          type: string
          nullable: true

    MensajeContacto:
      type: object
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        mensaje:
          type: string
        respuesta:
          type: string
          nullable: true
        fecha:
          type: string
        fecha_respuesta:
          type: string
          nullable: true
        leido:
          type: integer
          description: '0 = No leido/No respondido, 1 = Respondido'
        nombre:
          type: string
          description: Nombre del emisor (o su usuario).
        email:
          type: string
          description: Email de contacto.